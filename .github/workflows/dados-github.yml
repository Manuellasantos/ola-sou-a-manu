# Atualiza os dados do GitHub toda segunda-feira (ou manualmente).
# Os scripts Python coletam a API, processam com Pandas e salvam public/data/github.json.
# O token usado é o GITHUB_TOKEN automático do Actions: ele nunca vai para o site.
name: Atualizar dados do GitHub

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest tests/python -q
      - name: Coletar e processar
        run: python scripts/gerar_tudo.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Salvar se algo mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add public/data docs
          git diff --cached --quiet || git commit -m "chore: atualizando os dados do github"
          git push
